[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-watch"
version = "0"
description = "AgentWatch core library, command line interface, and REST API"
requires-python = ">=3.12"
dependencies = ["click>=8.1,<9"]

[project.optional-dependencies]
pull-request-review = ["claude-agent-sdk>=0.2.182,<0.3"]
rest-api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
development = ["agent-watch[pull-request-review,rest-api]", "mypy>=1.11", "build>=1.2", "pytest>=8.3", "httpx2>=2.16", "jsonschema>=4.23,<5", "rfc3339-validator>=0.1.4,<1", "types-jsonschema>=4.23,<5"]

[project.scripts]
agent-watch = "agent_watch.cli.main:agent_watch"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_watch"]

[tool.mypy]
strict = true
mypy_path = "src:tests"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib"]
