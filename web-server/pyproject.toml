[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-watch-web-server"
version = "0"
description = "AgentWatch REST API server"
requires-python = ">=3.12"
dependencies = ["agent-watch", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
development = ["mypy>=1.11", "pytest>=8.3", "httpx2>=2.16"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_watch_web_server"]

[tool.mypy]
strict = true
mypy_path = "src:tests"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib"]
