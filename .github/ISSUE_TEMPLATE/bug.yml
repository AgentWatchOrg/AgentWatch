name: Bug
description: Something is broken
labels: ["bug"]
projects: ["AgentWatchOrg/1"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened vs. what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit / environment
