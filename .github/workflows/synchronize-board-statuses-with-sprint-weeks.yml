name: Synchronize board statuses with sprint weeks

on:
  issues:
    types: [opened, reopened, closed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      is_dry_run:
        description: "Only print what would change"
        type: boolean
        default: true

concurrency:
  group: synchronize-board-statuses-with-sprint-weeks

jobs:
  synchronize_board_statuses_with_sprint_weeks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install agent-watch from main
        run: pip install "git+https://github.com/${{ github.repository }}.git@main#subdirectory=lib"
      - name: Add new issues to backlog and match sprint weeks to statuses
        env:
          # The default GITHUB_TOKEN cannot edit org projects.
          PROJECT_BOARD_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          IS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.is_dry_run || 'false' }}
        run: agent-watch project-board synchronize-statuses
