name: Sprint rollover

on:
  schedule:
    # Cron is UTC: midnight Monday in Calgary (01:00 during daylight time).
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would change"
        type: boolean
        default: true

concurrency:
  group: sprint-rollover

jobs:
  rollover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Roll unfinished cards into this week
        env:
          # The default GITHUB_TOKEN cannot edit org projects.
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python .github/scripts/sprint_rollover.py
