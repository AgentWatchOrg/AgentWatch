name: Test agent-watch web server

on:
  pull_request:
  push:
    branches: [main]

jobs:
  run_web_server_type_checks_and_unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e lib -e "web-server[development]"
      - working-directory: web-server
        run: mypy src tests
      - working-directory: web-server
        run: pytest
