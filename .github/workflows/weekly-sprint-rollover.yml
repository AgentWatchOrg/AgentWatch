name: Weekly sprint rollover

on:
  schedule:
    # Cron is UTC: midnight Monday in Calgary (01:00 during daylight time).
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      is_dry_run:
        description: "Only print what would change"
        type: boolean
        default: true

concurrency:
  group: weekly-sprint-rollover

jobs:
  roll_unfinished_cards_into_current_week:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install latest agent-watch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "${{ github.repository }}" --pattern "agent_watch_cli-*.whl" --dir agent-watch-release
          pip install agent-watch-release/*.whl
      - name: Roll unfinished cards into this week
        env:
          # The default GITHUB_TOKEN cannot edit org projects.
          PROJECT_BOARD_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          IS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.is_dry_run || 'false' }}
        run: agent-watch project-board roll-over-sprint
