name: Build and deploy documentation site

on:
  push:
    branches: [main]
    paths: ["documentation/**", "documentation-site-requirements.txt", "mkdocs.yml"]
  pull_request:
    paths: ["documentation/**", "documentation-site-requirements.txt", "mkdocs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-and-deploy-documentation-site
  cancel-in-progress: true

jobs:
  build_documentation_site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r documentation-site-requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: built-documentation-site

  deploy_documentation_site_to_github_pages:
    if: github.ref == 'refs/heads/main'
    needs: build_documentation_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
