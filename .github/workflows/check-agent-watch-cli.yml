name: Check agent-watch CLI

on:
  pull_request:
    paths: ["cli/**"]
  push:
    branches: [main]
    paths: ["cli/**"]

jobs:
  type_check_and_build_cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "cli[development]"
      - run: mypy cli/src
      - run: python -m build --outdir built-cli-packages cli
      - run: agent-watch --version
