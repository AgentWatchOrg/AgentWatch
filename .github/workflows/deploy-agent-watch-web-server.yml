name: Deploy agent-watch web server

on:
  workflow_run:
    workflows: ["Test agent-watch library"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-agent-watch-web-server

jobs:
  deploy_web_server_to_ec2:
    if: vars.WEB_SERVER_INSTANCE_ID != '' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    env:
      DEPLOYED_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.WEB_SERVER_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.WEB_SERVER_AWS_REGION }}
      - name: Mirror the server's secrets from GitHub into Parameter Store
        env:
          GITHUB_WEBHOOK_SECRET: ${{ secrets.BOARD_WEBHOOK_SECRET }}
          PROJECT_BOARD_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          for variable_name in GITHUB_WEBHOOK_SECRET PROJECT_BOARD_TOKEN; do
            secret_value=${!variable_name}
            parameter_name=/agent-watch/rest-api/$(tr '[:upper:]_' '[:lower:]-' <<<"$variable_name")
            if [[ -n $secret_value ]]; then
              aws ssm put-parameter --name "$parameter_name" --type SecureString --overwrite --value "$secret_value" \
                --query Version --output text >/dev/null
              echo "Updated $parameter_name"
            elif delete_error=$(aws ssm delete-parameter --name "$parameter_name" 2>&1); then
              echo "Deleted $parameter_name; its GitHub secret is not set"
            elif [[ $delete_error != *ParameterNotFound* ]]; then
              echo "$delete_error" >&2
              exit 1
            fi
          done
      - name: Run the deploy script on the instance
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "${{ vars.WEB_SERVER_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --parameters "commands=[\"git -C /opt/agent-watch fetch --quiet origin\",\"git -C /opt/agent-watch reset --quiet --hard $DEPLOYED_COMMIT\",\"/opt/agent-watch/infrastructure/web-server/deploy_web_server.sh $DEPLOYED_COMMIT\"]" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id "${{ vars.WEB_SERVER_INSTANCE_ID }}" || true
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "${{ vars.WEB_SERVER_INSTANCE_ID }}" \
            --query '[Status, StandardOutputContent, StandardErrorContent]' --output text
          test "$(aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "${{ vars.WEB_SERVER_INSTANCE_ID }}" --query Status --output text)" = Success
      - name: Check the server responds
        run: curl --fail --silent --retry 10 --retry-delay 3 --retry-all-errors "${{ vars.WEB_SERVER_URL }}/health"
