name: Deploy agent-watch web server

on:
  workflow_run:
    workflows: ["Test agent-watch web server"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-agent-watch-web-server

jobs:
  deploy_web_server_to_ec2:
    if: vars.WEB_SERVER_INSTANCE_ID != '' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    env:
      DEPLOYED_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.WEB_SERVER_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.WEB_SERVER_AWS_REGION }}
      - name: Run the deploy script on the instance
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "${{ vars.WEB_SERVER_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --parameters "commands=[\"/opt/agent-watch/infrastructure/web-server/deploy_web_server.sh $DEPLOYED_COMMIT\"]" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id "${{ vars.WEB_SERVER_INSTANCE_ID }}" || true
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "${{ vars.WEB_SERVER_INSTANCE_ID }}" \
            --query '[Status, StandardOutputContent, StandardErrorContent]' --output text
          test "$(aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "${{ vars.WEB_SERVER_INSTANCE_ID }}" --query Status --output text)" = Success
      - name: Check the server responds
        run: curl --fail --silent --retry 10 --retry-delay 3 --retry-all-errors "${{ vars.WEB_SERVER_URL }}/health"
