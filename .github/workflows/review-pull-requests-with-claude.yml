name: Review pull requests with RoboReviewer

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Pull request to review"
        type: number
        required: true
      is_dry_run:
        description: "Only print the comments it would post"
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-pull-request-with-claude-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  review_pull_request_with_claude:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Stop when no Claude credential is configured
        id: check_claude_credential
        run: |
          if [ -n "$ANTHROPIC_API_KEY$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "has_claude_credential=true" >> "$GITHUB_OUTPUT"
          else
            echo "Set the ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN repository secret to enable reviews."
          fi
      - if: steps.check_claude_credential.outputs.has_claude_credential == 'true'
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ env.PULL_REQUEST_NUMBER }}/head
          fetch-depth: 0
      - if: steps.check_claude_credential.outputs.has_claude_credential == 'true'
        name: Use main's Claude configuration so a pull request cannot change its own review rules
        run: |
          for claude_configuration_path in .claude CLAUDE.md .mcp.json; do
            rm -rf "$claude_configuration_path"
            git checkout origin/main -- "$claude_configuration_path" 2>/dev/null || true
          done
      - if: steps.check_claude_credential.outputs.has_claude_credential == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.check_claude_credential.outputs.has_claude_credential == 'true'
        name: Install agent-watch from main
        run: pip install "agent-watch[claude-agent] @ git+https://github.com/${{ github.repository }}.git@main#subdirectory=lib"
      - if: steps.check_claude_credential.outputs.has_claude_credential == 'true' && vars.ROBO_REVIEWER_APP_ID != ''
        name: Sign in as RoboReviewer
        id: create_robo_reviewer_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ROBO_REVIEWER_APP_ID }}
          private-key: ${{ secrets.ROBO_REVIEWER_PRIVATE_KEY }}
      - if: steps.check_claude_credential.outputs.has_claude_credential == 'true'
        name: Review the pull request
        env:
          GITHUB_TOKEN: ${{ steps.create_robo_reviewer_token.outputs.token || github.token }}
          PULL_REQUEST_REVIEWER_MODEL: ${{ vars.PULL_REQUEST_REVIEWER_MODEL || 'claude-opus-5-5' }}
          IS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.is_dry_run || 'false' }}
        run: agent-watch pull-request-review review
