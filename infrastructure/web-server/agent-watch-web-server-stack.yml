AWSTemplateFormatVersion: "2010-09-09"
Description: AgentWatch web server on EC2, deployed from GitHub Actions through SSM.

Parameters:
  InstanceType:
    Type: String
    Default: t4g.nano
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
  GitHubRepository:
    Type: String
    Default: AgentWatchOrg/AgentWatch
  GitHubImmutableRepository:
    Type: String
    Default: AgentWatchOrg@357137988/AgentWatch@1406681981
    Description: owner@id/name@id, from `gh api repos/<owner>/<name>/actions/oidc/customization/sub`.

Resources:
  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP to the AgentWatch web server. No SSH; administration goes through SSM.
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  WebServerInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadWebServerParameters
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/agent-watch/web-server/*

  WebServerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref WebServerInstanceRole]

  WebServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref ImageId
      IamInstanceProfile: !Ref WebServerInstanceProfile
      SecurityGroupIds: [!GetAtt WebServerSecurityGroup.GroupId]
      MetadataOptions:
        HttpTokens: required
      Tags:
        - Key: Name
          Value: agent-watch-web-server
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          # t4g.nano has 512 MB of memory; dnf is killed without swap.
          dd if=/dev/zero of=/swapfile bs=1M count=1024
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo "/swapfile none swap defaults 0 0" >> /etc/fstab
          dnf install -y git python3.12
          useradd --system --no-create-home agentwatch
          git clone https://github.com/${GitHubRepository}.git /opt/agent-watch
          /opt/agent-watch/infrastructure/web-server/deploy_web_server.sh origin/main

  WebServerElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      InstanceId: !Ref WebServerInstance

  GitHubActionsOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Federated: !Ref GitHubActionsOidcProvider}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubRepository}:ref:refs/heads/main
                  - !Sub repo:${GitHubImmutableRepository}:ref:refs/heads/main
      Policies:
        - PolicyName: DeployWebServerThroughSsm
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${WebServerInstance}
                  - !Sub arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript
              - Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: "*"

Outputs:
  WebServerUrl:
    Value: !Sub http://${WebServerElasticIp}
  WebServerInstanceId:
    Value: !Ref WebServerInstance
  DeployRoleArn:
    Value: !GetAtt GitHubActionsDeployRole.Arn
