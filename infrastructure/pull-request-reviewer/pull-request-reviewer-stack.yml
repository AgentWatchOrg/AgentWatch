AWSTemplateFormatVersion: "2010-09-09"
Description: Role that lets the AgentWatch pull request reviewer call Claude on Amazon Bedrock from GitHub Actions.

Parameters:
  GitHubActionsOidcProviderArn:
    Type: String
    Description: The account's existing token.actions.githubusercontent.com provider, created by the agent-watch-web-server stack.
  GitHubRepository:
    Type: String
    Default: AgentWatchOrg/AgentWatch
  GitHubImmutableRepository:
    Type: String
    Default: AgentWatchOrg@357137988/AgentWatch@1406681981
    Description: owner@id/name@id, from `gh api repos/<owner>/<name>/actions/oidc/customization/sub`.

Resources:
  PullRequestReviewerRole:
    Type: AWS::IAM::Role
    Properties:
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Federated: !Ref GitHubActionsOidcProviderArn}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubRepository}:pull_request
                  - !Sub repo:${GitHubImmutableRepository}:pull_request
                  - !Sub repo:${GitHubRepository}:ref:refs/heads/main
                  - !Sub repo:${GitHubImmutableRepository}:ref:refs/heads/main
      Policies:
        - PolicyName: InvokeClaudeOnBedrock
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - arn:aws:bedrock:*::foundation-model/anthropic.*
                  - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*anthropic.*

Outputs:
  PullRequestReviewerRoleArn:
    Value: !GetAtt PullRequestReviewerRole.Arn
