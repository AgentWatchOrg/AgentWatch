[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-watch-cli"
dynamic = ["version"]
description = "Command line tools for the AgentWatch project"
requires-python = ">=3.12"
dependencies = ["click>=8.1,<9"]

[project.optional-dependencies]
development = ["mypy>=1.11", "build>=1.2"]

[project.scripts]
agent-watch = "agent_watch_cli.command_line_entry_point:agent_watch"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_watch_cli"]

[tool.mypy]
strict = true
